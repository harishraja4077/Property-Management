<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found - Stackly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="preloader" id="preloader"><div class="preloader-spinner"></div></div>

  <!-- Error Page -->
  <section class="error-page">
    <div class="error-bg">
      <img src="Assets/error-bg.webp" alt="Background">
    </div>
    <div class="error-overlay"></div>

    <!-- Floating decorative shapes -->
    <div class="error-shape error-shape-1"></div>
    <div class="error-shape error-shape-2"></div>
    <div class="error-shape error-shape-3"></div>

    <div class="error-content">
      <div class="error-code">404</div>
      <h1>Oops! Page Not Found</h1>
      <p>The page you're looking for seems to have moved, or it doesn't exist. Let's get you back to exploring the perfect property.</p>

      <div class="error-buttons">
        <a href="index.html" class="btn btn-primary"><i class="fas fa-home"></i> Back to Home</a>
        <a href="#" onclick="history.back(); return false;" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Go Back</a>
      </div>
    </div>
  </section>

  <script src="js/script.js"></script>
</body>
</html>
